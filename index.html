<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>แจ้งซ่อม</title>
  <style>
    :root {
      --ink: #292524;
      --paper: #FAF9F6;
      --orange: #E8590C;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
    }
    .loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px;
      background: var(--paper);
      transition: opacity 0.3s ease;
    }
    .loading.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #E7E3DB;
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading span { color: #78716C; font-size: 13px; }

    iframe {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
      background: var(--paper);
    }
  </style>
</head>
<body>

  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    <span>กำลังโหลดฟอร์มแจ้งซ่อม...</span>
  </div>

  <!--
    !! แก้ตรงนี้ !!
    เปลี่ยน src ด้านล่างเป็น URL ของ Web App "Public Form" ที่ deploy ไว้
    (ลงท้ายด้วย /exec — ไม่ต้องใส่ ?page=form เพราะ default อยู่แล้ว)
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/แก้เป็น_DEPLOYMENT_ID_ของคุณ/exec"
    onload="document.getElementById('loadingScreen').classList.add('hide')"
    title="แบบฟอร์มแจ้งซ่อม">
  </iframe>

</body>
</html>
