<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ระบบแจ้งซ่อม - Admin</title>

  <!-- favicon: ประแจสีส้มบนพื้นเข้ม เพื่อแยกแท็บแอดมินออกจากหน้าแจ้งซ่อมของผู้ใช้ -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C1917'/%3E%3Cg transform='translate(4 4)'%3E%3Cpath fill='%23E8590C' d='M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z'/%3E%3C/g%3E%3C/svg%3E">
  <meta name="theme-color" content="#1C1917">

  <style>
    :root {
      --ink: #1C1917;
      --paper: #F5F4F1;
      --orange: #E8590C;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--paper);
      transition: opacity 0.3s ease;
    }

    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E7E3DB;
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading span {
      color: #78716C;
      font-size: 13px;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--paper);
    }
  </style>
</head>

<body>

  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    <span>กำลังโหลดหน้าแอดมิน...</span>
  </div>

  <!--
    !! แก้ตรงนี้ !!
    เปลี่ยน src ด้านล่างเป็น URL ของ Web App "Admin Dashboard" ที่ deploy ไว้
    ต้องมี ?page=admin ต่อท้ายด้วยเสมอ
  -->
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxhaB1TPZj44enHcDN0uAE9eKxHLmSW6auFWvl4Sxfp6D8ByatoZjLBD2a-mr3rAyW5Ew/exec?page=admin"
    onload="document.getElementById('loadingScreen').classList.add('hide')" title="หน้าแอดมินระบบแจ้งซ่อม">
  </iframe>

</body>

</html>
