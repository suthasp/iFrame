<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ระบบแจ้งซ่อม - Admin</title>
  <style>
    :root {
      --ink: #1C1917;
      --paper: #F5F4F1;
      --orange: #E8590C;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--paper);
      transition: opacity 0.3s ease;
    }

    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E7E3DB;
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading span {
      color: #78716C;
      font-size: 13px;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--paper);
    }
  </style>
</head>

<body>

  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    <span>กำลังโหลดหน้าแอดมิน...</span>
  </div>

  <!--
    !! แก้ตรงนี้ !!
    เปลี่ยน src ด้านล่างเป็น URL ของ Web App "Admin Dashboard" ที่ deploy ไว้
    ต้องมี ?page=admin ต่อท้ายด้วยเสมอ
  -->
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz_mE9nApuFHHfBTRhoXRXM2lbB7GETXXs9Z5PwZOo5C9LQEUXSOjrwAQaIfKnC6rpZGw/exec?page=admin?page=admin"
    onload="document.getElementById('loadingScreen').classList.add('hide')" title="หน้าแอดมินระบบแจ้งซ่อม">
  </iframe>

</body>

</html>
